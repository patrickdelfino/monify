services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: monify
      MARIADB_USER: monify
      MARIADB_PASSWORD: ${MONIFY_DB_PASSWORD:?Defina MONIFY_DB_PASSWORD no arquivo .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - database:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MONIFY_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: monify
      WORDPRESS_DB_PASSWORD: ${MONIFY_DB_PASSWORD:?Defina MONIFY_DB_PASSWORD no arquivo .env}
      WORDPRESS_DB_NAME: monify
    volumes:
      - wordpress:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/monify-demo:ro

  cli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: monify
      WORDPRESS_DB_PASSWORD: ${MONIFY_DB_PASSWORD:?Defina MONIFY_DB_PASSWORD no arquivo .env}
      WORDPRESS_DB_NAME: monify
      MONIFY_PORT: ${MONIFY_PORT:-8080}
      MONIFY_ADMIN_PASSWORD: ${MONIFY_ADMIN_PASSWORD:?Defina MONIFY_ADMIN_PASSWORD no arquivo .env}
    volumes:
      - wordpress:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/monify-demo:ro
      - ./scripts:/demo:ro

volumes:
  database:
  wordpress:
